name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/maven-operator
  PROXY_IMAGE: ghcr.io/${{ github.repository_owner }}/maven-virtual-proxy
  AUTH_PROXY_IMAGE: ghcr.io/${{ github.repository_owner }}/maven-auth-proxy
  IMPORT_JOB_IMAGE: ghcr.io/${{ github.repository_owner }}/maven-import-job
  METADATA_BROKER_IMAGE: ghcr.io/${{ github.repository_owner }}/maven-metadata-broker
  CHART_NAME: maven-operator

jobs:
  # ── Compute the canonical semver for this run ───────────────────────────────
  # Uses paulhatch/semantic-version which derives the version purely from the
  # git tag history and conventional-commit messages:
  #
  #   Untagged commit  →  MAJOR.MINOR.PATCH-pre.N  (N = commits since last tag)
  #   Tagged v1.2.3    →  1.2.3                     (exact release)
  #
  # Major/minor bumps are driven by commit messages:
  #   feat:  or feat(scope):            → minor bump
  #   feat!: or BREAKING CHANGE:        → major bump
  #   anything else                     → patch bump
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
      is_release: ${{ steps.is_release.outputs.is_release }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required so the action can walk back to the last tag.
          fetch-depth: 0

      - name: Compute semantic version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "/(feat|fix|refactor|perf)!:|BREAKING CHANGE:/"
          minor_pattern: "/feat(\\(.+\\))?:/"
          # Snapshot format:  1.2.3-pre.4  (4 = commits since last tag)
          version_format: "${major}.${minor}.${patch}-pre.${increment}"
          search_commit_body: true
          bump_each_commit: false

      - name: Determine if this is a release tag
        id: is_release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Version: ${{ steps.semver.outputs.version }} (RELEASE)"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Version: ${{ steps.semver.outputs.version }} (snapshot)"
          fi

  # ── Build & Unit tests ──────────────────────────────────────────────────────
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit Tests (MavenOperator.Tests.Unit)
        run: >
          dotnet test MavenOperator.Tests.Unit/MavenOperator.Tests.Unit.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit-results.trx"
          --collect "XPlat Code Coverage"

      - name: Unit Tests (MavenOperator.Tests.Unit.VirtualProxy)
        run: >
          dotnet test MavenOperator.Tests.Unit.VirtualProxy/MavenOperator.Tests.Unit.VirtualProxy.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit-vp-results.trx"
          --collect "XPlat Code Coverage"

      - name: Unit Tests (MavenOperator.Tests.Unit.MetadataBroker)
        run: >
          dotnet test MavenOperator.Tests.Unit.MetadataBroker/MavenOperator.Tests.Unit.MetadataBroker.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit-mb-results.trx"
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

  # ── Docker build (tarballs for test jobs; NOT pushed to registry yet) ────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [version, build-and-test]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build operator image (export tarball only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MavenOperator/Dockerfile
          push: false
          tags: maven-operator:ci
          outputs: type=docker,dest=/tmp/maven-operator.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build virtual-proxy image (export tarball only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MavenOperator.VirtualProxy/Dockerfile
          push: false
          tags: maven-virtual-proxy:ci
          outputs: type=docker,dest=/tmp/maven-virtual-proxy.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build metadata-broker image (export tarball only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MavenOperator.MetadataBroker/Dockerfile
          push: false
          tags: maven-metadata-broker:ci
          outputs: type=docker,dest=/tmp/maven-metadata-broker.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build auth-proxy image (export tarball only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MavenOperator.AuthProxy/Dockerfile
          push: false
          tags: maven-auth-proxy:ci
          outputs: type=docker,dest=/tmp/maven-auth-proxy.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build import-job image (export tarball only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MavenOperator.ImportJob/Dockerfile
          push: false
          tags: maven-import-job:ci
          outputs: type=docker,dest=/tmp/maven-import-job.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image tarballs
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            /tmp/maven-operator.tar
            /tmp/maven-virtual-proxy.tar
            /tmp/maven-auth-proxy.tar
            /tmp/maven-import-job.tar
            /tmp/maven-metadata-broker.tar
          retention-days: 1

  # ── Integration tests ───────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: false  # Disabled - run manually via GitHub Actions > Actions tab
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Download pre-built Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: |
          docker load -i /tmp/maven-operator.tar
          docker load -i /tmp/maven-virtual-proxy.tar
          docker load -i /tmp/maven-auth-proxy.tar
          docker load -i /tmp/maven-import-job.tar
          docker load -i /tmp/maven-metadata-broker.tar

      - name: Run integration tests
        env:
          OPERATOR_IMAGE: maven-operator:ci
          VIRTUAL_PROXY_IMAGE: maven-virtual-proxy:ci
          METADATA_BROKER_IMAGE: maven-metadata-broker:ci
          # CI runners have limited RAM — use 1 agent node but raise the pod ceiling
          # so all test repositories can be scheduled without hitting the default 110 limit.
          K3D_AGENTS: "1"
          K3D_MAX_PODS: "250"
        run: ./scripts/run-tests.sh integration --cleanup

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/*.trx"

  # ── E2E tests (Linux / k3d) ────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Linux / k3d)
    runs-on: ubuntu-latest
    needs: docker-build
    if: false  # Disabled - run manually via GitHub Actions > Actions tab
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Setup Java (Maven/Gradle toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Maven
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends maven

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Download pre-built Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: |
          docker load -i /tmp/maven-operator.tar
          docker load -i /tmp/maven-virtual-proxy.tar
          docker load -i /tmp/maven-auth-proxy.tar
          docker load -i /tmp/maven-import-job.tar
          docker load -i /tmp/maven-metadata-broker.tar

      - name: Run E2E tests
        env:
          OPERATOR_IMAGE: maven-operator:ci
          VIRTUAL_PROXY_IMAGE: maven-virtual-proxy:ci
          METADATA_BROKER_IMAGE: maven-metadata-broker:ci
          # Raise pod ceiling for the import + e2e test repositories
          K3D_AGENTS: "1"
          K3D_MAX_PODS: "250"
        run: ./scripts/run-tests.sh e2e --cleanup

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: "**/*.trx"

  # ── E2E tests (macOS / Apple container) ──────────────────────────────────────
  # Runs on Apple Silicon Macs using the native 'container' Kubernetes tool.
  # This enables developers to run the same E2E tests on their MacBooks.
  e2e-macos:
    name: E2E Tests (macOS / Apple container)
    runs-on: macos-latest
    needs: docker-build
    if: false  # Disabled - run manually via GitHub Actions > Actions tab
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Setup Java (Maven/Gradle toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Maven
        run: brew install maven

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Install Apple 'container' tool (if not pre-installed)
        run: |
          # GitHub macos-latest runners may have 'container' pre-installed.
          # If not, the Homebrew tap provides it.
          if ! command -v container &>/dev/null; then
            brew tap apple/container-cli
            brew install apple-container
          fi
          container --version

      - name: Create and verify container k8s cluster
        run: |
          container k8s create --name maven-operator-test --cpus 2 --memory 4g
          container k8s list

      - name: Download pre-built Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Build & load images into cluster
        run: |
          # Build images with container build (macOS native)
          # Each image builds from the repo root; container handles
          # architecture-specific builds automatically on Apple Silicon.
          container build --no-cache -f MavenOperator/Dockerfile -t maven-operator:ci .
          container k8s load-image --name maven-operator-test maven-operator:ci

          container build --no-cache -f MavenOperator.VirtualProxy/Dockerfile -t maven-virtual-proxy:ci .
          container k8s load-image --name maven-operator-test maven-virtual-proxy:ci

          container build --no-cache -f MavenOperator.AuthProxy/Dockerfile -t maven-auth-proxy:ci .
          container k8s load-image --name maven-operator-test maven-auth-proxy:ci

          container build --no-cache -f MavenOperator.ImportJob/Dockerfile -t maven-import-job:ci .
          container k8s load-image --name maven-operator-test maven-import-job:ci

      - name: Run E2E tests
        env:
          OPERATOR_IMAGE: maven-operator:ci
          VIRTUAL_PROXY_IMAGE: maven-virtual-proxy:ci
          # Single-node cluster (no agents) — import tests need RWO PVC on same node
          K3D_AGENTS: "0"
          K3D_MAX_PODS: "250"
        run: ./scripts/run-tests.sh e2e --cleanup

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-macos-test-results
          path: "**/*.trx"

      - name: Cleanup
        if: always()
        run: container k8s delete --name maven-operator-test 2>/dev/null || true

  # ── Performance tests (smoke + BenchmarkDotNet; k6 load is local-only) ──────
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: false  # Disabled - run manually via GitHub Actions > Actions tab
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Download pre-built Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: |
          docker load -i /tmp/maven-operator.tar
          docker load -i /tmp/maven-virtual-proxy.tar
          docker load -i /tmp/maven-auth-proxy.tar
          docker load -i /tmp/maven-import-job.tar
          docker load -i /tmp/maven-metadata-broker.tar

      - name: Run performance smoke tests (xUnit ceilings)
        env:
          OPERATOR_IMAGE: maven-operator:ci
          VIRTUAL_PROXY_IMAGE: maven-virtual-proxy:ci
          METADATA_BROKER_IMAGE: maven-metadata-broker:ci
        run: ./scripts/run-tests.sh performance --perf-mode smoke

      - name: Run BenchmarkDotNet micro-benchmarks
        env:
          OPERATOR_IMAGE: maven-operator:ci
          VIRTUAL_PROXY_IMAGE: maven-virtual-proxy:ci
          METADATA_BROKER_IMAGE: maven-metadata-broker:ci
        run: ./scripts/run-tests.sh performance --perf-mode benchmark

      - name: Upload performance test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: |
            **/*.trx
            .benchmarks/BenchmarkDotNet.Artifacts/**

  # ── Release helpers: compute tags once, shared by all image jobs ─────────────
  release-tags:
    name: Compute Release Tags
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version]
    outputs:
      operator_tags: ${{ steps.tags.outputs.operator_tags }}
      proxy_tags: ${{ steps.tags.outputs.proxy_tags }}
      auth_proxy_tags: ${{ steps.tags.outputs.auth_proxy_tags }}
      import_job_tags: ${{ steps.tags.outputs.import_job_tags }}
      metadata_broker_tags: ${{ steps.tags.outputs.metadata_broker_tags }}

    steps:
      # Build the full set of Docker tags from the canonical version.
      # Release (v1.2.3 tag):  1.2.3, 1.2, latest
      # Snapshot (any branch): 1.2.3-pre.N, <branch-name>
      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IS_RELEASE: ${{ needs.version.outputs.is_release }}
        run: |
          BASE_OP="${OPERATOR_IMAGE}:${VERSION}"
          BASE_PX="${PROXY_IMAGE}:${VERSION}"
          BASE_AP="${AUTH_PROXY_IMAGE}:${VERSION}"
          BASE_IJ="${IMPORT_JOB_IMAGE}:${VERSION}"
          BASE_MB="${METADATA_BROKER_IMAGE}:${VERSION}"

          if [[ "$IS_RELEASE" == "true" ]]; then
            MAJOR_MINOR="${VERSION%.*}"
            OP_TAGS="${BASE_OP},${OPERATOR_IMAGE}:${MAJOR_MINOR},${OPERATOR_IMAGE}:latest"
            PX_TAGS="${BASE_PX},${PROXY_IMAGE}:${MAJOR_MINOR},${PROXY_IMAGE}:latest"
            AP_TAGS="${BASE_AP},${AUTH_PROXY_IMAGE}:${MAJOR_MINOR},${AUTH_PROXY_IMAGE}:latest"
            IJ_TAGS="${BASE_IJ},${IMPORT_JOB_IMAGE}:${MAJOR_MINOR},${IMPORT_JOB_IMAGE}:latest"
            MB_TAGS="${BASE_MB},${METADATA_BROKER_IMAGE}:${MAJOR_MINOR},${METADATA_BROKER_IMAGE}:latest"
          else
            BRANCH_SAFE="$(echo "${GITHUB_REF_NAME}" | tr -cs 'a-zA-Z0-9-' '-' | sed 's/-*$//')"
            OP_TAGS="${BASE_OP},${OPERATOR_IMAGE}:${BRANCH_SAFE}"
            PX_TAGS="${BASE_PX},${PROXY_IMAGE}:${BRANCH_SAFE}"
            AP_TAGS="${BASE_AP},${AUTH_PROXY_IMAGE}:${BRANCH_SAFE}"
            IJ_TAGS="${BASE_IJ},${IMPORT_JOB_IMAGE}:${BRANCH_SAFE}"
            MB_TAGS="${BASE_MB},${METADATA_BROKER_IMAGE}:${BRANCH_SAFE}"
          fi

          echo "operator_tags=${OP_TAGS}" >> "$GITHUB_OUTPUT"
          echo "proxy_tags=${PX_TAGS}"    >> "$GITHUB_OUTPUT"
          echo "auth_proxy_tags=${AP_TAGS}" >> "$GITHUB_OUTPUT"
          echo "import_job_tags=${IJ_TAGS}" >> "$GITHUB_OUTPUT"
          echo "metadata_broker_tags=${MB_TAGS}" >> "$GITHUB_OUTPUT"
          echo "Operator tags: ${OP_TAGS}"
          echo "Proxy tags:    ${PX_TAGS}"
          echo "AuthProxy tags:${AP_TAGS}"
          echo "ImportJob tags:${IJ_TAGS}"
          echo "Broker  tags: ${MB_TAGS}"

  # ── Release images (4 parallel jobs, one per image) ─────────────────────────
  release-operator-image:
    name: Push Operator Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, build-and-test, docker-build, release-tags]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push operator image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MavenOperator/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.release-tags.outputs.operator_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-virtual-proxy-image:
    name: Push Virtual Proxy Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, build-and-test, docker-build, release-tags]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push virtual-proxy image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MavenOperator.VirtualProxy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.release-tags.outputs.proxy_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-auth-proxy-image:
    name: Push Auth Proxy Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, build-and-test, docker-build, release-tags]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push auth-proxy image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MavenOperator.AuthProxy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.release-tags.outputs.auth_proxy_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-import-job-image:
    name: Push Import Job Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs:
      version
      build-and-test
      docker-build
      release-tags
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push import-job image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MavenOperator.ImportJob/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.release-tags.outputs.import_job_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release Helm chart (after all images are pushed) ────────────────────────
  release-metadata-broker-image:
    name: Push Metadata Broker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs:
      version
      build-and-test
      docker-build
      release-tags
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push metadata-broker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: MavenOperator.MetadataBroker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.release-tags.outputs.metadata_broker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-helm-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, build-and-test, docker-build, release-tags,
            release-operator-image, release-virtual-proxy-image, release-auth-proxy-image,
            release-import-job-image, release-metadata-broker-image]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "3.17.3"

      - name: Stamp version into Chart.yaml
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: \"${VERSION}\"/"       charts/maven-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/maven-operator/Chart.yaml
          echo "Stamped Chart.yaml:"
          cat charts/maven-operator/Chart.yaml

      - name: Lint Helm chart
        run: helm lint charts/maven-operator

      - name: Package Helm chart
        run: helm package charts/maven-operator --destination /tmp/helm-packages

      - name: Log in to GHCR (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Push Helm chart to GHCR
        run: |
          helm push /tmp/helm-packages/*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Upload Helm package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: /tmp/helm-packages/*.tgz

