{{- if .Values.rbac.create -}}
{{- $operatorServiceAccountName := include "maven-operator.serviceAccountName" . -}}
{{- $importJobServiceAccountName := include "maven-operator.importJobServiceAccountName" . -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "maven-operator.fullname" . }}
  labels:
    {{- include "maven-operator.labels" . | nindent 4 }}
rules:
  # MavenRepository and MavenRepositoryImport CRDs
  - apiGroups: ["maven.operator.io"]
    resources: ["mavenrepositories", "mavenrepositoryimports"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["maven.operator.io"]
    resources: ["mavenrepositories/status", "mavenrepositoryimports/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["maven.operator.io"]
    resources: ["mavenrepositories/finalizers", "mavenrepositoryimports/finalizers"]
    verbs: ["update"]

  # Core resources managed or queried by the operator
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ServiceAccounts and ClusterRoleBindings for lazy-init of import-job SA per namespace
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]

  # Apps and batch resources managed by reconcilers/controllers
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Networking resources managed by repository reconcilers
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Kubernetes Gateway API resources managed/queried by repository reconcilers
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses", "referencegrants"]
    verbs: ["get", "list", "watch"]

  # Cert-Manager resources managed by repository reconcilers
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers", "clusterissuers"]
    verbs: ["get", "list", "watch"]

  # Prometheus Operator resources created when metrics are enabled
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "maven-operator.fullname" . }}
  labels:
    {{- include "maven-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "maven-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ $operatorServiceAccountName }}
    namespace: {{ .Release.Namespace }}

---
# ClusterRole for import Jobs — grants permissions needed across all namespaces.
# The operator lazily creates a ServiceAccount + ClusterRoleBinding in each namespace
# where an import Job runs (see MavenRepositoryImportController.EnsureImportJobServiceAccountAsync).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "maven-operator.fullname" . }}-import-job
  labels:
    {{- include "maven-operator.labels" . | nindent 4 }}
rules:
  # Mode C: scale Reposilite Deployment to 0 during import, restore after
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Transfer mode resolution: check PVC access modes and pod bindings
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch"]

  # Progress reporting: patch Job annotations for progress tracking
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "patch"]

  # Read target repository info (for HTTP transfer mode)
  - apiGroups: ["maven.operator.io"]
    resources: ["mavenrepositories"]
    verbs: ["get", "list"]

  # Report progress back to the import CRD
  - apiGroups: ["maven.operator.io"]
    resources: ["mavenrepositoryimports/status"]
    verbs: ["patch"]
{{- end }}

